<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar App Sample</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-title-row">
      <h1 id="teamNameTitle">Calendar App</h1>
      <button id="editTeamButton" class="secondary-button" type="button" hidden>編集</button>
    </div>
    <h2>チームID　<span id="teamCodeDayo">
      teamCode
    </span></h2>
    <p>月表示のカレンダーと、日付ごとの簡単な予定管理を行うサンプルです。</p>
  </header>

  <main class="app">
    <section class="card calendar-card">
      <div class="calendar-toolbar">
        <button id="prevMonthButton" class="icon-button" aria-label="前の月">←</button>

        <div class="calendar-title">
          <p class="eyebrow">CALENDAR</p>
          <h2 id="monthTitle"></h2>
        </div>

        <button id="nextMonthButton" class="icon-button" aria-label="次の月">→</button>
      </div>

      <div class="weekday-row">
        <div class="sunday">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div class="saturday">土</div>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>

      <div class="calendar-actions">
        <button id="todayButton" class="secondary-button">今日に戻る</button>
      </div>
    </section>

    <div id="teamEditDialog" class="dialog-backdrop" hidden>
      <section class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="teamEditTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TEAM SETTINGS</p>
            <h2 id="teamEditTitle">チーム情報を編集</h2>
          </div>
          <button id="closeTeamEditButton" class="icon-button" type="button" aria-label="閉じる">×</button>
        </div>
        <form id="teamEditForm" class="edit-form">
          <label for="teamNameInput">チーム名</label>
          <input id="teamNameInput" type="text" maxlength="50" required>
          <label for="memberNameInput">自分のチーム内での名前</label>
          <input id="memberNameInput" type="text" maxlength="30" required>
          <p id="teamEditMessage" class="dialog-message" role="status"></p>
          <div class="dialog-actions">
            <button id="cancelTeamEditButton" class="secondary-button" type="button">キャンセル</button>
            <button class="primary-button" type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>

    <section class="card schedule-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">SCHEDULE</p>
          <div class="selected-date-row">
            <h2 id="selectedDateTitle">日付を選択してください</h2>
            <button id="setGoalDateButton" class="goal-date-button" hidden>目標日に設定する</button>
          </div>
        </div>
        <span id="scheduleCount" class="status-badge">0件</span>
      </div>

      <div class="schedule-form">
        <input
          id="scheduleInput"
          type="text"
          placeholder="予定を入力"
          disabled
        >
        <button id="addScheduleButton" class="primary-button" disabled>追加</button>
      </div>

      <div id="progressSummary" class="progress-summary" hidden>
        <div class="progress-label">
          <span>達成率</span>
          <strong id="completionRate">100%</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="目標日までのタスク達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div id="completionMeter" class="progress-meter"></div>
        </div>
      </div>

      <div id="scheduleList" class="schedule-list">
        <div class="empty-schedule">
          カレンダーの日付をクリックすると、その日の予定を追加できます。
        </div>
      </div>
    </section>

    <section class="card members-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MEMBERS</p>
          <h2>チームメンバー</h2>
        </div>
        <span id="memberCount" class="status-badge">0人</span>
      </div>

      <div id="memberList" class="member-list">
        <div class="empty-schedule">メンバーを読み込んでいます。</div>
      </div>
    </section>

    

  <script type="module" src="script.js"></script>
</body>
</html>
